<app-header></app-header>

<main *ngIf="mealDetail">
  <section class="card data">
    <app-meal-card [mealDetail]="mealDetail"></app-meal-card>
  </section>
  <section class="data ingredients">
    <h2>Ingredients</h2>

    <ul class="ingredients">
      <li *ngFor="let i of mealDetail.mealIngredients">
        {{ i.measure }} {{ i.ingredient }}
      </li>
    </ul>
  </section>
  <section class="data">
    <h2>Instructions</h2>
    <div class="instructions">
      <ul>
        <li *ngFor="let i of mealDetail.mealInstructions">
          {{ i }}
        </li>
      </ul>
    </div>
  </section>
</main>
<app-footer></app-footer>
